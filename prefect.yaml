name: mlworkflows

# Build/push is handled by GitHub Actions (.github/workflows/build.yaml).
# This file is used only for `prefect deploy`.

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: chunk-documents
    tags: ["embedding", "embedding-training-pipeline"]
    description: "Chunk source sections into final embedding documents and upload the JSONL output to GCS"
    entrypoint: embeddings/flows/chunk_documents.py:chunk_documents_flow
    parameters:
      source_bucket: development-research
      source_blob: custom_embeddings/sampled_library_sections.json
      dest_bucket: development-research
      dest_blob: custom_embeddings/sampled_library_sections_chunked_documents.jsonl
      max_workers: 48
      cache_path: /cache/patot/embedding_cache.sqlite
      cache_max_entries: 100000
      section_limit: null
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: generate-query-dataset
    tags: ["embedding", "embedding-training-pipeline"]
    description: "Generate retrieval queries and qrels from chunked documents and upload dataset artifacts to GCS"
    entrypoint: embeddings/flows/generate_query_dataset.py:generate_query_dataset_flow
    parameters:
      source_bucket: development-research
      source_blob: custom_embeddings/sampled_library_sections_chunked_documents.jsonl
      dest_bucket: development-research
      dest_prefix: custom_embeddings/sampled_library_sections_query_dataset
      model: claude-sonnet-4-6
      max_workers: 4
      cache_path: /cache/query_generation/llm_cache.sqlite
      flush_llm_cache: false
      document_limit: null
      queries_per_type_per_doc: 1
      query_types_per_doc: 2
      query_type_sample_seed: 613
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: sample-chunk-eval-query-dataset
    tags: ["embedding", "embedding-evaluation-pipeline"]
    description: "Sample held-out raw sections, chunk them, generate retrieval queries/qrels, and upload eval dataset artifacts to GCS"
    entrypoint: embeddings/flows/sample_chunk_eval_query_dataset.py:sample_chunk_eval_query_dataset_flow
    parameters:
      source_bucket: development-research
      source_blob: custom_embeddings/sampled_library_sections.json
      training_dataset_bucket: development-research
      training_dataset_prefix: custom_embeddings/sampled_library_sections_query_dataset
      dest_bucket: development-research
      dest_prefix: custom_embeddings/eval/sampled_library_sections_eval_query_dataset
      sample_size: 100
      sample_seed: 613
      distractor_sample_size: 1000
      distractor_sample_seed: 614
      chunk_max_workers: 48
      chunk_cache_path: /cache/patot/embedding_cache.sqlite
      model: claude-sonnet-4-6
      query_max_workers: 4
      query_cache_path: /cache/query_generation/eval_llm_cache.sqlite
      flush_llm_cache: false
      queries_per_type_per_doc: 1
      query_types_per_doc: 2
      query_type_sample_seed: 613
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: visualize-eval-query-dataset
    tags: ["embedding", "embedding-evaluation-pipeline"]
    description: "Render the full eval query dataset artifacts into one PDF and upload it to GCS"
    entrypoint: embeddings/flows/visualize_eval_query_dataset.py:visualize_eval_query_dataset_flow
    parameters:
      source_bucket: development-research
      source_prefix: custom_embeddings/eval/sampled_library_sections_eval_query_dataset
      dest_bucket: development-research
      dest_blob: custom_embeddings/eval/sampled_library_sections_eval_query_dataset.pdf
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: evaluate-embeddings
    tags: ["embedding", "embedding-evaluation-pipeline"]
    description: "Evaluate the latest trained BEREL SentenceTransformer model against the held-out eval query dataset"
    entrypoint: embeddings/flows/evaluate_embeddings.py:evaluate_embeddings_flow
    parameters:
      eval_dataset_bucket: development-research
      eval_dataset_prefix: custom_embeddings/eval/sampled_library_sections_eval_query_dataset
      report_bucket: development-research
      report_prefix: custom_embeddings/eval/embedding_evaluation
      evaluation_backend: latest
      workflow_name: evaluate-embeddings
      model_bucket: development-research
      latest_model_prefix: custom_embeddings/models/berel_sentence_transformer/latest
      gcs_model_prefix: null  # Required only when evaluation_backend is custom.
      sentence_transformer_batch_size: 32
      normalize_sentence_transformer_embeddings: true
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        memory_request: 8Gi
        memory_limit: 12Gi
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        gpu_limit: "1"
    schedules: []

  - name: evaluate-embeddings-base
    tags: ["embedding", "embedding-evaluation-pipeline"]
    description: "Evaluate the untrained base BEREL_3.0 model as a sanity-check baseline"
    entrypoint: embeddings/flows/evaluate_embeddings.py:evaluate_base_embeddings_flow
    parameters:
      eval_dataset_bucket: development-research
      eval_dataset_prefix: custom_embeddings/eval/sampled_library_sections_eval_query_dataset
      report_bucket: development-research
      report_prefix: custom_embeddings/eval/embedding_evaluation_base
      sentence_transformer_batch_size: 32
      normalize_sentence_transformer_embeddings: true
      base_model_repo_id: dicta-il/BEREL_3.0
      base_model_hub_cache_dir: /cache/huggingface
      workflow_name: evaluate-embeddings-base
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        memory_request: 8Gi
        memory_limit: 12Gi
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        gpu_limit: "1"
    schedules: []

  - name: evaluate-embeddings-gemini
    tags: ["embedding", "embedding-evaluation-pipeline"]
    description: "Evaluate Gemini embeddings (gemini-embedding-001, dim=1536, dot similarity) against the held-out eval query dataset"
    entrypoint: embeddings/flows/evaluate_embeddings.py:evaluate_gemini_embeddings_flow
    parameters:
      eval_dataset_bucket: development-research
      eval_dataset_prefix: custom_embeddings/eval/sampled_library_sections_eval_query_dataset
      report_bucket: development-research
      report_prefix: custom_embeddings/eval/embedding_evaluation_gemini
      gemini_cache_path: /cache/evaluation/gemini_embedding_cache.sqlite
      gemini_cache_enabled: true
      gemini_max_workers: 4
      workflow_name: evaluate-embeddings-gemini
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        memory_request: 8Gi
        memory_limit: 12Gi
    schedules: []

  - name: evaluate-embeddings-llm-relevance
    tags: ["embedding", "embedding-evaluation-pipeline"]
    description: "Evaluate embedding top-K retrieval with Claude binary relevance judgments over the held-out eval corpus"
    entrypoint: embeddings/flows/evaluate_embeddings_llm_relevance.py:evaluate_embeddings_llm_relevance_flow
    parameters:
      eval_dataset_bucket: development-research
      eval_dataset_prefix: custom_embeddings/eval/sampled_library_sections_eval_query_dataset
      report_bucket: development-research
      report_prefix: custom_embeddings/eval/embedding_llm_relevance_evaluation
      evaluation_backend: latest
      model_bucket: development-research
      latest_model_prefix: custom_embeddings/models/berel_sentence_transformer/latest
      gcs_model_prefix: null
      sentence_transformer_batch_size: 32
      normalize_sentence_transformer_embeddings: true
      top_k: 10
      judge_model: claude-sonnet-4-6
      judge_max_workers: 4
      judge_cache_path: /cache/evaluation/llm_relevance_cache.sqlite
      judge_cache_enabled: true
      flush_judge_cache: false
      workflow_name: evaluate-embeddings-llm-relevance
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        memory_request: 8Gi
        memory_limit: 12Gi
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        gpu_limit: "1"
    schedules: []

  - name: evaluate-embeddings-llm-relevance-gemini
    tags: ["embedding", "embedding-evaluation-pipeline"]
    description: "Evaluate Gemini top-K retrieval with Claude binary relevance judgments over the held-out eval corpus"
    entrypoint: embeddings/flows/evaluate_embeddings_llm_relevance.py:evaluate_embeddings_llm_relevance_flow
    parameters:
      eval_dataset_bucket: development-research
      eval_dataset_prefix: custom_embeddings/eval/sampled_library_sections_eval_query_dataset
      report_bucket: development-research
      report_prefix: custom_embeddings/eval/embedding_llm_relevance_evaluation_gemini
      evaluation_backend: gemini
      top_k: 10
      gemini_cache_path: /cache/evaluation/gemini_embedding_cache.sqlite
      gemini_cache_enabled: true
      gemini_max_workers: 4
      judge_model: claude-sonnet-4-6
      judge_max_workers: 4
      judge_cache_path: /cache/evaluation/llm_relevance_cache.sqlite
      judge_cache_enabled: true
      flush_judge_cache: false
      workflow_name: evaluate-embeddings-llm-relevance-gemini
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        memory_request: 8Gi
        memory_limit: 12Gi
    schedules: []

  - name: compare-embedding-evaluations
    tags: ["embedding", "embedding-evaluation-pipeline"]
    description: "Bayesian paired comparison of two embedding evaluation reports"
    entrypoint: embeddings/flows/compare_embedding_evaluations.py:compare_embedding_evaluations_flow
    parameters:
      evaluation_a_bucket: development-research
      evaluation_a_prefix: custom_embeddings/eval/embedding_evaluation/latest
      evaluation_b_bucket: development-research
      evaluation_b_prefix: custom_embeddings/eval/embedding_evaluation_gemini/latest
      report_bucket: development-research
      report_prefix: custom_embeddings/eval/embedding_evaluation_comparisons
      metric: ndcg@10
      rope: 0.005
      posterior_draws: 20000
      seed: 613
      credible_interval_mass: 0.95
      confidence_level: 0.95
      evaluation_a_label: berel
      evaluation_b_label: gemini
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: visualize-embedding-retrieval
    tags: ["embedding", "embedding-evaluation-pipeline"]
    description: "Visualize top-10 retrieval results per sampled query with score-gradient highlighting and correct-doc markers"
    entrypoint: embeddings/flows/visualize_embedding_retrieval.py:visualize_embedding_retrieval_flow
    parameters:
      eval_dataset_bucket: development-research
      eval_dataset_prefix: custom_embeddings/eval/sampled_library_sections_eval_query_dataset
      eval_report_bucket: development-research
      eval_report_prefix: custom_embeddings/eval/embedding_evaluation/latest
      dest_bucket: development-research
      dest_blob: custom_embeddings/eval/embedding_retrieval_visualization/latest.pdf
      sample_count: 20
      sample_seed: 0
      selection_strategy: random
      worst_metric: ndcg@10
      worst_pool_size: null
      include_positive_documents: false
      workflow_name: visualize-embedding-retrieval
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: visualize-worst-embedding-retrieval
    tags: ["embedding", "embedding-evaluation-pipeline"]
    description: "Visualize sampled worst-performing retrieval queries with expected positives and top retrieved documents"
    entrypoint: embeddings/flows/visualize_embedding_retrieval.py:visualize_embedding_retrieval_flow
    parameters:
      eval_dataset_bucket: development-research
      eval_dataset_prefix: custom_embeddings/eval/sampled_library_sections_eval_query_dataset
      eval_report_bucket: development-research
      eval_report_prefix: custom_embeddings/eval/embedding_evaluation/latest
      dest_bucket: development-research
      dest_blob: custom_embeddings/eval/embedding_retrieval_visualization/worst_latest.pdf
      sample_count: 50
      sample_seed: 0
      selection_strategy: worst
      worst_metric: ndcg@10
      worst_pool_size: 150
      include_positive_documents: true
      workflow_name: visualize-worst-embedding-retrieval
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: visualize-chunk-samples
    tags: ["embedding", "embedding-debug-test"]
    description: "Sample chunked sections, rerun PATOT in debug mode, and upload one combined PDF visualization to GCS"
    entrypoint: embeddings/flows/visualize_chunk_samples.py:visualize_chunk_samples_flow
    parameters:
      source_bucket: development-research
      source_blob: custom_embeddings/sampled_library_sections.json
      chunked_bucket: development-research
      chunked_blob: custom_embeddings/sampled_library_sections_chunked_documents.jsonl
      dest_bucket: development-research
      dest_blob: custom_embeddings/sampled_library_sections_chunk_samples.pdf
      sample_count: 10
      sample_seed: 0
      cache_path: /cache/patot/embedding_cache.sqlite
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: visualize-query-dataset
    tags: ["embedding", "embedding-debug-test"]
    description: "Sample generated query-dataset documents and upload one combined PDF visualization to GCS"
    entrypoint: embeddings/flows/visualize_query_dataset.py:visualize_query_dataset_flow
    parameters:
      source_bucket: development-research
      source_prefix: custom_embeddings/sampled_library_sections_query_dataset
      dest_bucket: development-research
      dest_blob: custom_embeddings/sampled_library_sections_query_dataset_samples.pdf
      sample_count: 10
      sample_seed: 0
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: test-cache-volume
    tags: ["embedding", "embedding-debug-test"]
    description: "Write a probe file into the mounted cache volume and upload a JSON report to GCS"
    entrypoint: embeddings/flows/test_cache_volume.py:test_cache_volume_flow
    parameters:
      dest_bucket: development-research
      dest_blob: cache_volume_probe.json
      cache_path: /cache
      probe_subdir: prefect-cache-probe
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: probe-runtime
    tags: ["embedding", "embedding-debug-test"]
    description: "Probe the flow-run pod runtime environment and upload a JSON report to GCS"
    entrypoint: embeddings/flows/probe_runtime.py:probe_runtime_flow
    parameters:
      dest_bucket: development-research
      dest_blob: workflow_runtime_probe.json
      scratch_path: /tmp
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: probe-gpu-availability
    tags: ["embedding", "embedding-debug-test"]
    description: "Probe GPU scheduling and runtime CUDA availability, then upload a JSON report to GCS"
    entrypoint: embeddings/flows/probe_gpu_availability.py:probe_gpu_availability_flow
    parameters:
      dest_bucket: development-research
      dest_blob: gpu_availability_probe.json
      matrix_size: 512
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        gpu_limit: "1"
    schedules: []

  - name: test-slack-webhook
    tags: ["embedding", "embedding-debug-test"]
    description: "Temporarily post a test message to the configured Slack webhook"
    entrypoint: embeddings/flows/test_slack_webhook.py:test_slack_webhook_flow
    parameters:
      message: "ML Workflows Slack webhook test"
      include_timestamp: true
      username: ml-workflows
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: create-dataset
    tags: ["embedding", "embedding-training-pipeline"]
    description: "Pull raw data from GCS, chunk it, and push the dataset back to GCS"
    entrypoint: embeddings/flows/create_dataset.py:create_dataset_flow
    parameters:
      source_bucket: development-research
      source_blob: custom_embeddings/sampled_library_sections.json
      dest_bucket: development-research
      dest_blob: custom_embeddings/sampled_library_sections_processed_clean_chunked.jsonl
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: train-embeddings
    tags: ["embedding", "embedding-training-pipeline"]
    description: "Fine-tune a SentenceTransformers embedding model from generated query/document pairs"
    entrypoint: embeddings/flows/train_embeddings.py:train_embeddings_flow
    parameters:
      source_bucket: development-research
      source_prefix: custom_embeddings/sampled_library_sections_query_dataset
      model_bucket: development-research
      model_prefix: custom_embeddings/models/berel_sentence_transformer
      report_bucket: development-research
      report_blob: custom_embeddings/training_report.json
      model_repo_id: dicta-il/BEREL_3.0
      revision: null
      cache_root: /cache/huggingface
      force_download: false
      validate_model: true
      max_seq_length: 512
      normalize_embeddings: true
      batch_size: 16
      epochs: 3
      warmup_steps: null
      learning_rate: 0.00002
      max_examples: null
      use_amp: null
      validation_fraction: 0.1
      validation_seed: 0
      evaluation_steps: null
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        gpu_limit: "1"
    schedules: []

  - name: prepare-mlm-corpus
    tags: ["encoder-pretraining"]
    description: "Tokenize and pack the English training corpus into fixed-length ModernBERT MLM windows and upload the shards to GCS"
    entrypoint: encoder_pretraining/flows/prepare_mlm_corpus.py:prepare_mlm_corpus_flow
    parameters:
      source_bucket: sefaria-ml-models
      source_blob: english-training-data/2026-10-26-v4/english_training_data.jsonl.gz
      dest_bucket: sefaria-ml-models
      dest_prefix: modernbert/corpus/2026-10-26-v4
      model_repo_id: answerdotai/ModernBERT-base
      revision: null
      cache_root: /cache/huggingface
      max_seq_length: 1024
      shard_sequences: 100000
      document_limit: null  # Set a small number for a smoke run.
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        volumes: []  # Skip the shared ReadWriteOnce embeddings-pvc so these jobs can run on other nodes.
        volume_mounts: []
        memory_request: 8Gi
        memory_limit: 16Gi
    schedules: []

  # run_name is required and is supplied by pretrain-supervisor so restarts reuse the same checkpoints.
  - name: pretrain-modernbert
    tags: ["encoder-pretraining"]
    description: "Continue masked-language-model pretraining of ModernBERT on a spot A100, checkpointing to GCS and resuming after preemption"
    entrypoint: encoder_pretraining/flows/pretrain_modernbert.py:pretrain_modernbert_flow
    parameters:
      corpus_bucket: sefaria-ml-models
      corpus_prefix: modernbert/corpus/2026-10-26-v4
      model_bucket: sefaria-ml-models
      model_prefix: modernbert/runs
      model_repo_id: answerdotai/ModernBERT-base
      revision: null
      cache_root: /cache/huggingface
      force_download: false
      mlm_probability: 0.3
      learning_rate: 0.0001
      weight_decay: 0.01
      warmup_ratio: 0.05
      lr_scheduler_type: linear
      epochs: 3
      max_tokens: null  # Cap total training tokens, for example 30000000 for a learning-rate sweep run.
      global_batch_sequences: 512
      per_device_batch_size: 16  # 32 runs out of memory on a 40GB A100 (the MLM logits alone are about 6GB in fp32).
      eval_steps: 250
      eval_max_sequences: 2000
      checkpoint_minutes: 10
      attn_implementation: auto
      reference_compile: false
      seed: 0
      dataloader_num_workers: 0
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows-gpu-train:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        volumes: []  # Skip the shared ReadWriteOnce embeddings-pvc so these jobs can run on other nodes.
        volume_mounts: []
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        node_selector:
          cloud.google.com/gke-accelerator: nvidia-tesla-a100
          cloud.google.com/gke-provisioning: spot
        gpu_limit: "1"
        cpu_request: "8"
        memory_request: 48Gi
        memory_limit: 64Gi
        pod_watch_timeout_seconds: 3600
    schedules: []

  - name: pretrain-supervisor
    tags: ["encoder-pretraining"]
    description: "Run pretrain-modernbert and restart it after spot evictions; can move to on-demand A100s after repeated crashes when allow_on_demand is enabled"
    entrypoint: encoder_pretraining/flows/pretrain_supervisor.py:pretrain_supervisor_flow
    parameters:
      deployment_name: pretrain-modernbert-flow/pretrain-modernbert
      run_name: null  # Defaults to this flow run's id. Set a name to resume an earlier run.
      gpu_parameters: {}  # Overrides for pretrain-modernbert, for example {"learning_rate": 0.0003, "max_tokens": 30000000}.
      max_attempts: 6
      spot_attempts: 4
      allow_on_demand: false  # Needs NVIDIA_A100_GPUS quota and an a100-ondemand pool; both are 0/absent in development-205018.
      retry_delay_seconds: 120
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        volumes: []  # Skip the shared ReadWriteOnce embeddings-pvc so these jobs can run on other nodes.
        volume_mounts: []
    schedules: []

  # model_prefix is required: pass the run's final model, for example modernbert/runs/<run_name>/final.
  - name: evaluate-mlm
    tags: ["encoder-pretraining"]
    description: "Compare masked-token loss and accuracy of the pretrained model against base ModernBERT, per source"
    entrypoint: encoder_pretraining/flows/evaluate_mlm.py:evaluate_mlm_flow
    parameters:
      corpus_bucket: sefaria-ml-models
      corpus_prefix: modernbert/corpus/2026-10-26-v4
      model_bucket: sefaria-ml-models
      report_bucket: sefaria-ml-models
      report_blob: modernbert/eval/mlm_evaluation.json
      base_model_repo_id: answerdotai/ModernBERT-base
      revision: null
      cache_root: /cache/huggingface
      mlm_probability: 0.3
      eval_max_sequences: 5000
      batch_size: 16
      seed: 0
      attn_implementation: auto
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows-gpu-train:latest
        image_pull_policy: Always
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        volumes: []  # Skip the shared ReadWriteOnce embeddings-pvc so these jobs can run on other nodes.
        volume_mounts: []
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        node_selector:
          cloud.google.com/gke-accelerator: nvidia-tesla-a100
          cloud.google.com/gke-provisioning: spot
        gpu_limit: "1"
        cpu_request: "4"
        memory_request: 16Gi
        memory_limit: 24Gi
        pod_watch_timeout_seconds: 3600
    schedules: []
