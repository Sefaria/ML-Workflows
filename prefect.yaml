name: mlworkflows

# Build/push is handled by GitHub Actions (.github/workflows/build.yaml).
# This file is used only for `prefect deploy`.

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: create-dataset
    tags: ["data-processing"]
    description: "Pull raw data from GCS, chunk it, and push the dataset back to GCS"
    entrypoint: flows/create_dataset.py:create_dataset_flow
    parameters:
      source_bucket: development-research
      source_blob: sampled_library_sections.json
      dest_bucket: development-research
      dest_blob: sampled_library_sections_processed_clean_chunked.jsonl
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        namespace: ml-infra
        service_account_name: ml-workflows-runner
    schedules: []

  - name: train-embeddings
    tags: ["ml", "gpu"]
    description: "Pull normalized dataset from GCS and fine-tune a sentence embedding model"
    entrypoint: flows/train_embeddings.py:train_embeddings_flow
    parameters:
      source_bucket: development-research
      model_bucket: development-research
    work_pool:
      name: sefaria-k8s
      job_variables:
        image: us-east1-docker.pkg.dev/YOUR_GKE_PROJECT/containers/mlworkflows:latest
        namespace: ml-infra
        service_account_name: ml-workflows-runner
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        resources:
          limits:
            nvidia.com/gpu: "1"
    schedules: []
