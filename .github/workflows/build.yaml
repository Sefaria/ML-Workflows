name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      sha_tag: ${{ steps.short_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: short_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/${{ secrets.DEV_GKE_PROJECT_ID }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ${{ secrets.GKE_SA }}

      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          file: Dockerfile
          tags: |
            us-docker.pkg.dev/${{ secrets.DEV_GKE_PROJECT }}/container/mlworkflows:latest
            us-docker.pkg.dev/${{ secrets.DEV_GKE_PROJECT }}/container/mlworkflows:sha-${{ steps.short_sha.outputs.sha }}

  deploy:
    name: Deploy Prefect Flows
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Prefect
        run: pip install prefect>=3.0.0 prefect-gcp>=0.6.0

      - name: Deploy flows
        env:
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          GKE_PROJECT: ${{ secrets.DEV_GKE_PROJECT }}
        run: |
          sed -i "s/YOUR_GKE_PROJECT/${GKE_PROJECT}/g" prefect.yaml
          prefect deploy --all
